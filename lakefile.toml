name = "lean-sync"
version = "0.1.0"
defaultTargets = ["LeanCrdt", "LeanSync"]

[[lean_lib]]
name = "LeanCrdt"

# Sync protocol and wire format on top of the CRDT (see docs/sync-design.md).
[[lean_lib]]
name = "LeanSync"

# Native tests for the CRDT core (see Tests/Main.lean and scripts/test-stack.sh).
[[lean_exe]]
name = "crdt-tests"
root = "Tests.Main"

# Native tests for the sync protocol and wire format (see Tests/Sync.lean and scripts/test-sync.sh).
[[lean_exe]]
name = "sync-tests"
root = "Tests.Sync"
