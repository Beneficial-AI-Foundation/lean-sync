name = "lean-crdt"
version = "0.1.0"
defaultTargets = ["LeanCrdt", "LeanSync"]

[[lean_lib]]
name = "LeanCrdt"

# Sync protocol and wire format on top of the CRDT (see docs/sync-design.md).
[[lean_lib]]
name = "LeanSync"

# Spike: Lean -> WebAssembly feasibility demo (see docs/spike-lean-wasm.md).
[[lean_lib]]
name = "WasmDemo"

# Native build of the same code, used as the reference the wasm output is checked against.
[[lean_exe]]
name = "wasm-demo-native"
root = "WasmDemo"

# Native tests for the CRDT core (see Tests/Main.lean and scripts/test-stack.sh).
[[lean_exe]]
name = "crdt-tests"
root = "Tests.Main"
